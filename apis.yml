aid: plotapi
name: PlotAPI
description: Automotive and property data API. The published surface covers US VIN histories and vehicle
  specifications, UK MOT records, auto parts fitment catalogues, vehicle valuations, and property listings
  for the UK and US markets, served as typed JSON over a single REST endpoint. Positioned for AI agents
  and for developers who would otherwise integrate several gated data sources separately. The product
  is real and live; what is not public is the interface — documentation, the API reference and key issuance
  all sit behind an account sign-in, and the machine-readable artifacts the site advertises are not currently
  served.
