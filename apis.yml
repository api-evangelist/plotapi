x-evidence:
  round: '2026-08-19'
  admitted_from: 'Add-API form submission plotapi-0055b91c at 22:11:55 UTC (gate confidence 25, reason
    low_confidence) and api-search/inbox issue #11 opened four minutes later by the same party. LISTED
    rather than declined: a valid company with a real API gets an entry, and the score is what tells them
    how it reads from outside.'
  the_blocker_is_the_login_not_the_missing_files: https://plotapi.co/dashboard/docs returns 200 but only
    1,090 bytes of visible text carrying six sign-in prompts — it is an account wall, not documentation.
    /docs, /api-reference and /pricing all 404. So no operation, parameter, response shape, rate limit
    or price is readable by anyone without an account, which is why this entry carries a single undescribed
    API rather than an operation inventory.
  advertised_artifacts_not_served: 'The submitted apis.json URL and two files linked in the site footer
    all return the site 404 page: plotapi.co/apis.json, /openapi.json and /llms.txt each return exactly
    11,358 bytes — byte-identical to an invented control path (/zzz-not-real-9137). Checked with both
    a default client user-agent and a browser user-agent; identical either way, so this is not bot filtering
    hiding them. They are advertised and not served.'
  provenance: Nothing here is derived or modelled. The single API entry records what the site states about
    itself; no operations are asserted because none are readable.
  flagged_for_review: Marketing copy leads on bypassing portal blocks and enterprise compliance forms
    and names AutoZone, Copart, Zillow and Rightmove as sources. How data is obtained from named third
    parties is a separate question from the artifact gaps above and is NOT settled by this listing. Recorded
    so it is not lost.
